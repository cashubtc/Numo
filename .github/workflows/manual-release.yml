name: Manual Release

# This workflow will only be triggered manually through the GitHub UI
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      version_code:
        description: 'Android versionCode (must exceed every previous release)'
        required: true
        type: number
      release_notes:
        description: 'Release notes shown in the app'
        required: false
        type: string
      pre_release:
        description: 'Is this a pre-release?'
        required: false
        default: 'false'
        type: boolean

# Add explicit permissions for the GITHUB_TOKEN
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CODE: ${{ inputs.version_code }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Validate release version
        run: |
          python3 - <<'PYVALIDATE'
          import os, re
          assert re.fullmatch(r'v?\d+\.\d+(?:\.\d+)?(?:[-.][A-Za-z0-9.-]+)?', os.environ['RELEASE_VERSION'])
          assert 0 < int(os.environ['RELEASE_CODE']) <= 2100000000
          PYVALIDATE

      # Decode the base64 encoded keystore string to keystore.jks
      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p $HOME/keystore
          echo $ENCODED_KEYSTORE | base64 -d > $HOME/keystore/app-release.keystore

      # Update app/build.gradle.kts with the signing configuration
      - name: Set up signing configuration
        run: |
          cat <<EOT >> app/build.gradle.kts
          
          // Added by GitHub Actions for app signing
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("$HOME/keystore/app-release.keystore")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }
              
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
                  getByName("play") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOT

      # Enable native debug symbols for pre-releases
      - name: Enable debug symbols for pre-release
        if: ${{ github.event.inputs.pre_release == 'true' }}
        run: |
          cat <<EOT >> app/build.gradle.kts
          
          // Added by GitHub Actions to bundle debug symbols for pre-release
          android {
              defaultConfig {
                  ndk {
                      debugSymbolLevel = "FULL"
                  }
              }
          }
          EOT

      # Build signed APK with release profile
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PnumoVersionCode="$RELEASE_CODE" -PnumoVersionName="${RELEASE_VERSION#v}"

      # Also build an Android App Bundle
      - name: Build Release Bundle (AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundlePlay -PnumoVersionCode="$RELEASE_CODE" -PnumoVersionName="${RELEASE_VERSION#v}"

      # Rename output artifacts to include numo and the version
      - name: Rename artifacts with numo and version
        run: |
          VERSION="$RELEASE_VERSION"
          APK_DIR="app/build/outputs/apk/release"
          BUNDLE_DIR="app/build/outputs/bundle/play"

          echo "Using version: $VERSION"

          if compgen -G "$APK_DIR/*.apk" > /dev/null; then
            for f in "$APK_DIR"/*.apk; do
              FILENAME=$(basename "$f")
              
              if [[ "$FILENAME" == *"universal"* ]]; then
                 SUFFIX="universal"
              elif [[ "$FILENAME" == *"armeabi-v7a"* ]]; then
                 SUFFIX="armeabi-v7a"
              elif [[ "$FILENAME" == *"arm64-v8a"* ]]; then
                 SUFFIX="arm64-v8a"
              elif [[ "$FILENAME" == *"x86_64"* ]]; then
                 SUFFIX="x86_64"
              elif [[ "$FILENAME" == *"x86"* ]]; then
                 SUFFIX="x86"
              else
                 # Default fallback if no specific architecture is found in the name
                 # This handles the case where it might just be 'app-release.apk'
                 SUFFIX="universal"
              fi
              
              NEW_NAME="numo-${VERSION}-${SUFFIX}.apk"
              echo "Renaming $f to $APK_DIR/$NEW_NAME"
              mv "$f" "$APK_DIR/$NEW_NAME"
            done
          else
            echo "No APK files found in $APK_DIR"
          fi

          if compgen -G "$BUNDLE_DIR/*.aab" > /dev/null; then
            for f in "$BUNDLE_DIR"/*.aab; do
              echo "Renaming $f to $BUNDLE_DIR/numo-${VERSION}.aab"
              mv "$f" "$BUNDLE_DIR/numo-${VERSION}.aab"
              break
            done
          else
            echo "No AAB files found in $BUNDLE_DIR"
          fi

      - name: Create signed update manifest
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PRE_RELEASE: ${{ inputs.pre_release }}
        run: |
          export KEYSTORE_PATH="$HOME/keystore/app-release.keystore"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          CHANNEL=stable
          if [ "$PRE_RELEASE" = true ]; then CHANNEL=beta; fi
          printf '%s' "$RELEASE_NOTES" > "$RUNNER_TEMP/update-notes.txt"
          python3 scripts/create_update_manifest.py \
            --apk "app/build/outputs/apk/release/numo-${RELEASE_VERSION}-universal.apk" \
            --tag "$RELEASE_VERSION" --channel "$CHANNEL" --check-latest \
            --aapt "$BUILD_TOOLS/aapt" --apksigner "$BUILD_TOOLS/apksigner" \
            --notes-file "$RUNNER_TEMP/update-notes.txt" \
            --output app/build/outputs/apk/release/update.json

      # Create a GitHub release draft with the signed APK and Bundle
      - name: Create Release Draft
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          draft: true
          body: ${{ inputs.release_notes }}
          prerelease: ${{ github.event.inputs.pre_release }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/update.json
            app/build/outputs/bundle/play/numo-${{ github.event.inputs.version }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
