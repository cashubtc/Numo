name: Manual Release

# This workflow will only be triggered manually through the GitHub UI
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      version_code:
        description: 'Android versionCode (must exceed every previous release)'
        required: true
        type: number
      release_notes:
        description: 'Release notes shown in the app'
        required: false
        type: string
      pre_release:
        description: 'Is this a pre-release?'
        required: false
        default: 'false'
        type: boolean

# Add explicit permissions for the GITHUB_TOKEN
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CODE: ${{ inputs.version_code }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Validate release version
        run: python3 scripts/validate_release.py

      # Decode the base64 encoded keystore string to keystore.jks
      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: bash scripts/manual_release.sh decode-keystore

      # Update app/build.gradle.kts with the signing configuration
      - name: Set up signing configuration
        run: bash scripts/manual_release.sh configure-signing

      # Enable native debug symbols for pre-releases
      - name: Enable debug symbols for pre-release
        if: ${{ github.event.inputs.pre_release == 'true' }}
        run: bash scripts/manual_release.sh enable-debug-symbols

      # Build signed APK with release profile
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/manual_release.sh build-apk

      # Also build an Android App Bundle
      - name: Build Release Bundle (AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash scripts/manual_release.sh build-bundle

      # Rename output artifacts to include numo and the version
      - name: Rename artifacts with numo and version
        run: bash scripts/manual_release.sh rename-artifacts

      - name: Create signed update manifest
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PRE_RELEASE: ${{ inputs.pre_release }}
        run: bash scripts/manual_release.sh create-manifest

      # Create a GitHub release draft with the signed APK and Bundle
      - name: Create Release Draft
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          draft: true
          body: ${{ inputs.release_notes }}
          prerelease: ${{ github.event.inputs.pre_release }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/update.json
            app/build/outputs/bundle/play/numo-${{ github.event.inputs.version }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
